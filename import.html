<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting…</title>
<style>
  body { margin:0; background:#0f1115; color:#e6e8ee; font:16px/1.55 system-ui,sans-serif; padding:24px; max-width:560px; margin:auto; text-align:center; }
  .big { font-size:54px; margin:30px 0 6px; }
  a.btn { display:inline-block; background:#4d8dff; color:#fff; text-decoration:none; border-radius:10px; padding:11px 18px; margin-top:16px; }
  .mut { color:#8b93a5; font-size:14px; }
  .err { color:#ff7b7b; }
</style>
</head>
<body>
<div class="big" id="ico">⏳</div>
<h2 id="ttl" style="margin:6px 0">Connecting your account…</h2>
<p id="txt" class="mut">Please wait.</p>
<div id="act"></div>

<script>
(async () => {
  const $ = s => document.querySelector(s);
  const code = new URLSearchParams(location.search).get('c') || '';
  const data = location.hash.slice(1);
  history.replaceState(null, '', '/import');   // remove the login data from the address bar
  if (!code || !data) {
    $('#ico').textContent = '⚠️'; $('#ttl').textContent = 'Nothing to import';
    $('#txt').innerHTML = 'Go to <a href="/connect" style="color:#4d8dff">Connect</a> and follow the steps again.'; return;
  }
  try {
    const r = await fetch('/session/import', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, data })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || ('Error ' + r.status));
    $('#ico').textContent = '✅'; $('#ttl').textContent = 'Success — account connected';
    $('#txt').textContent = j.account ? ('Signed in as ' + j.account) : 'Your login is saved. You can talk now.';
    $('#act').innerHTML = '<a class="btn" href="/">Open chat</a>';
  } catch (e) {
    $('#ico').textContent = '❌'; $('#ttl').textContent = 'Could not connect';
    $('#txt').className = 'err'; $('#txt').textContent = e.message;
    $('#act').innerHTML = '<a class="btn" href="/connect">Try again</a>';
  }
})();
</script>
</body>
</html>
