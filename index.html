<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Code Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e8ee; --mut:#8b93a5; --acc:#4d8dff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:270px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; transition:transform .2s; z-index:5; }
  #side .top { padding:12px; display:flex; gap:8px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 12px;
    font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--mut); padding:4px 8px; }
  button:disabled { opacity:.5; }
  #list { flex:1; overflow:auto; padding:0 8px; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--mut); }
  .item span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .item.on, .item:hover { background:var(--line); color:var(--txt); }
  #side .foot { padding:12px; border-top:1px solid var(--line); font-size:13px; }
  #side a { color:var(--acc); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { display:none; padding:8px 10px; border-bottom:1px solid var(--line); align-items:center; gap:8px; }
  #msgs { flex:1; overflow:auto; padding:16px 12px; }
  .wrap { max-width:820px; margin:0 auto; }
  .m { margin:0 0 18px; }
  .u { background:var(--line); padding:10px 14px; border-radius:12px; white-space:pre-wrap; margin-left:auto; max-width:90%; width:fit-content; }
  .a { overflow-wrap:anywhere; }
  .a p { margin:.5em 0; }
  .a pre { position:relative; background:#0b0d12; border:1px solid var(--line); padding:12px;
    border-radius:10px; overflow:auto; font-size:13px; }
  .a code { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .a :not(pre) > code { background:var(--line); padding:1px 5px; border-radius:5px; }
  .cp { position:absolute; top:6px; right:6px; padding:3px 9px; font-size:12px; background:var(--line); }
  .err { color:#ff7b7b; }
  .err a { color:var(--acc); }
  .empty { text-align:center; color:var(--mut); margin-top:20vh; }
  #in { border-top:1px solid var(--line); padding:10px; }
  #in .wrap { display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; background:var(--panel); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font:inherit; resize:none; max-height:180px; }
  @media (max-width:700px) {
    #side { position:fixed; inset:0 auto 0 0; transform:translateX(-100%); width:82%; }
    #side.open { transform:none; }
    #bar { display:flex; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="top"><button id="new" style="flex:1">+ New chat</button></div>
    <div id="list"></div>
    <div class="foot">
      <a href="/remote">Sign in to DeepSeek</a><br>
      <button class="ghost" id="chkey" style="padding:6px 0">Change API key</button>
    </div>
  </aside>
  <div id="main">
    <div id="bar"><button class="ghost" id="menu">☰</button><b id="ttl">My Code Chat</b></div>
    <div id="msgs"><div class="wrap" id="wrap"></div></div>
    <div id="in"><div class="wrap">
      <textarea id="msg" rows="1" placeholder="Ask for code… (Ctrl+Enter to send)"></textarea>
      <button id="send">Send</button>
    </div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let KEY = localStorage.getItem('key') || '';
let chats = [];
try { chats = JSON.parse(localStorage.getItem('chats') || '[]'); } catch (e) {}
chats.forEach(c => c.msgs = (c.msgs || []).filter(m => !m.pending));
let cur = chats.length ? chats[0].id : null;
let busy = false;

function save() { localStorage.setItem('chats', JSON.stringify(chats)); }
function askKey() {
  const k = prompt('Enter your API key:');
  if (k) { KEY = k.trim(); localStorage.setItem('key', KEY); }
}
function getChat() { return chats.find(c => c.id === cur); }

function cleanHtml(html) {
  const tpl = document.createElement('div');
  tpl.innerHTML = DOMPurify.sanitize(html);
  tpl.querySelectorAll('button, svg, [class*="banner"]').forEach(n => n.remove());
  tpl.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'cp'; b.textContent = 'Copy';
    b.onclick = () => {
      navigator.clipboard.writeText(pre.innerText.replace(/^Copy\n?/, ''));
      b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200);
    };
    pre.prepend(b);
  });
  return tpl;
}

function renderSide() {
  const list = $('#list'); list.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === cur ? ' on' : '');
    const t = document.createElement('span'); t.textContent = c.title;
    d.onclick = () => { cur = c.id; render(); $('#side').classList.remove('open'); };
    const x = document.createElement('button'); x.className = 'ghost'; x.textContent = '✕';
    x.onclick = e => {
      e.stopPropagation();
      if (!confirm('Delete this chat?')) return;
      chats = chats.filter(k => k.id !== c.id);
      if (cur === c.id) cur = chats.length ? chats[0].id : null;
      save(); render();
    };
    d.append(t, x); list.append(d);
  });
}

function renderMsgs() {
  const w = $('#wrap'); w.innerHTML = '';
  const c = getChat();
  $('#ttl').textContent = c ? c.title : 'My Code Chat';
  if (!c || !c.msgs.length) {
    w.innerHTML = '<div class="empty">Ask me to write some code 👇</div>'; return;
  }
  c.msgs.forEach(m => {
    const d = document.createElement('div');
    if (m.role === 'user') { d.className = 'm u'; d.textContent = m.text; }
    else if (m.error) {
      d.className = 'm err'; d.textContent = m.error;
      if (m.login) { d.append(' '); const a = document.createElement('a'); a.href = '/remote'; a.textContent = 'Open sign-in page'; d.append(a); }
    } else { d.className = 'm a'; d.append(cleanHtml(m.html || '')); }
    w.append(d);
  });
  const box = $('#msgs'); box.scrollTop = box.scrollHeight;
}

function render() { renderSide(); renderMsgs(); }

async function send() {
  const box = $('#msg'); const text = box.value.trim();
  if (!text || busy) return;
  if (!KEY) { askKey(); if (!KEY) return; }
  let c = getChat();
  if (!c) {
    c = { id: Date.now().toString(36), title: text.slice(0, 40), url: null, msgs: [] };
    chats.unshift(c); cur = c.id;
  }
  c.msgs.push({ role: 'user', text });
  const pending = { role: 'ai', html: '<p><em>Thinking…</em></p>', pending: true };
  c.msgs.push(pending);
  box.value = ''; box.style.height = 'auto';
  busy = true; $('#send').disabled = true; render();
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY },
      body: JSON.stringify({ message: text, chat_url: c.url })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 401) { KEY = ''; localStorage.removeItem('key'); }
      pending.error = j.detail || ('Error ' + r.status);
      pending.login = r.status === 409;
      delete pending.html;
    } else {
      c.url = j.chat_url; pending.html = j.html; pending.text = j.reply;
    }
  } catch (e) {
    pending.error = 'Network error: ' + e.message; delete pending.html;
  }
  delete pending.pending;
  busy = false; $('#send').disabled = false; save(); render();
}

$('#send').onclick = send;
$('#msg').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
$('#msg').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px'; });
$('#new').onclick = () => { cur = null; render(); $('#side').classList.remove('open'); $('#msg').focus(); };
$('#menu').onclick = () => $('#side').classList.toggle('open');
$('#chkey').onclick = () => { askKey(); };

if (!KEY) askKey();
render();
</script>
</body>
</html>
